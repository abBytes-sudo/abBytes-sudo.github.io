<body data-page="track">
<main id="main">
  <section class="wrap t-hero" id="tHero">
    <div>
      <p class="eyebrow">Order tracking</p>
      <h1 data-split data-now>Where’s my <em>order?</em></h1>
      <p class="lede" data-reveal data-now data-delay=".4">Enter the order number from your confirmation and the email you used at checkout. Signed in? Your orders are all in <a class="u" href="../store/account.html#orders">your account</a>.</p>
      <form id="tf" class="tf" novalidate data-reveal data-now data-delay=".55">
        <label class="fld"><span>Order number</span><input id="tNum" name="num" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="NL-10471" required></label>
        <label class="fld"><span>Email address</span><input id="tEmail" name="email" type="email" autocomplete="email" placeholder="you@example.com" required></label>
        <button class="btn" type="submit" data-magnetic>Track order <span class="arrow" aria-hidden="true">→</span></button>
        <p class="meta"><span id="demoHint"></span><button class="lnk" type="button" id="demoFill">Use a recent order</button></p>
        <p id="tErr" class="err" role="alert"></p>
      </form>
    </div>
    <figure class="fr t-ph" data-clip><img src="../store/photos/strip-1.jpg" srcset="../store/photos/w/strip-1-560.webp 560w, ../store/photos/w/strip-1-900.webp 900w" sizes="(max-width:960px) 92vw, 36vw" fetchpriority="high" alt="Folded sweaters stacked on a wooden stool in warm light" width="1100" height="1650" decoding="async"></figure>
  </section>
  <section class="wrap thx" id="thx" hidden aria-labelledby="thxH"></section>
  <section id="res" class="wrap res" aria-live="polite" hidden></section>
</main>
</body>
