<title>Request form — Fernhill Digital</title>
<meta name="description" content="Send a request to the Fernhill Digital team. It lands as a task in the project, with an owner, within seconds.">

<style>
  body{overflow:auto}
  .pf{max-width:620px;margin:0 auto;padding:40px 16px 90px}
  .pf .fprev{position:static;box-shadow:var(--sh-2);background:var(--surface)}
  .pf-done{text-align:center;padding:40px 24px}
  .pf-done .tick{width:56px;height:56px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center;margin:0 auto 14px}
  .pf-done h1{font-size:24px;letter-spacing:-.02em;margin-bottom:8px}
  .pf-done p{color:var(--muted)}
  .pf-ref{display:inline-block;margin-top:14px;font:500 13px var(--mono);background:var(--sunk);padding:6px 10px;border-radius:6px}
  .pf-foot{text-align:center;color:var(--faint);font-size:12px;margin-top:22px}
  .pf-foot a{text-decoration:underline}
</style>
